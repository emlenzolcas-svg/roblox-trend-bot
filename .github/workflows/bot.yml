
name: Roblox Trend Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  actions: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer l'historique
        uses: actions/cache/restore@v4
        with:
          path: data/history.json
          key: roblox-history-${{ github.run_id }}
          restore-keys: |
            roblox-history-

      - name: Recuperer les jeux Roblox
        run: python main.py

      - name: Analyser les tendances
        run: python analyze.py

      - name: Sauvegarder l'historique
        uses: actions/cache/save@v4
        with:
          path: data/history.json
          key: roblox-history-${{ github.run_id }}

      - name: Publier les rapports
        uses: actions/upload-artifact@v4
        with:
          name: rapport-roblox
          path: |
            data/trends.json
            data/analysis.json
            data/game_idea.md
            data/history.json
          if-no-files-found: error
          retention-days: 30
