
name: Roblox Trend Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: roblox-trend-bot
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperer les jeux Roblox
        run: python main.py

      - name: Analyser les tendances
        run: python analyze.py

      - name: Enregistrer l'historique dans GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Roblox trend history"
            git push origin HEAD:main
          else
            echo "Aucun changement dans l'historique."
          fi

      - name: Publier les rapports
        uses: actions/upload-artifact@v4
        with:
          name: rapport-roblox
          path: |
            data/trends.json
            data/analysis.json
            data/game_idea.md
            data/history.json
          if-no-files-found: error
          retention-days: 30
