
name: Roblox Trend Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperer les jeux Roblox
        run: python main.py

      - name: Analyser les tendances
        run: python analyze.py

      - name: Publier les rapports
        uses: actions/upload-artifact@v4
        with:
          name: rapport-roblox
          path: |
            data/trends.json
            data/analysis.json
            data/game_idea.md
          if-no-files-found: error
